
name: Build Materium Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK
        run: dart run fastforge:main release --name release --skip-clean --no-version-check

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: materium-android-apk
          path: dist/**/*.apk
          if-no-files-found: error
          retention-days: 7
